<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0e020c" />
  <meta name="format-detection" content="telephone=no" />
  <title>Happy Birthday Tyjaw • A Romantic Journey</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <!-- Remaining fonts loaded async to avoid blocking -->
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cinzel:wght@500;700&family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Outfit:wght@400;600;800&family=Sacramento&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
</head>

<body class="bg-[#0e020c] text-white selection:bg-[#c47087]/50 selection:text-white overflow-x-hidden min-h-screen">

  <!-- ✨ Instant Loading Screen — visible before JS bundle loads ✨ -->
  <div id="app-loading" style="
    position:fixed;inset:0;z-index:99999;
    background:#0e020c;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transition:opacity 0.6s ease;">
    <style>
      @keyframes hb{0%,100%{transform:scale(1);filter:drop-shadow(0 0 14px #c47087)}50%{transform:scale(1.18);filter:drop-shadow(0 0 32px #dfc188)}}
      @keyframes ld{0%,100%{opacity:.3}50%{opacity:1}}
      #app-loading svg{animation:hb 1.4s ease-in-out infinite}
      #app-loading p{animation:ld 1.6s ease-in-out infinite}
    </style>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none">
      <defs>
        <radialGradient id="hg" cx="50%" cy="38%" r="62%">
          <stop offset="0%" stop-color="#feeaf0"/>
          <stop offset="40%" stop-color="#e27893"/>
          <stop offset="100%" stop-color="#8a1f3c"/>
        </radialGradient>
      </defs>
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="url(#hg)"/>
    </svg>
    <p style="margin-top:20px;color:#dfc188;font-size:13px;letter-spacing:.15em;font-family:sans-serif;">MEMUAT KEJUTAN...</p>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Hide loading screen once React has mounted
    document.addEventListener('DOMContentLoaded', function() {
      var check = setInterval(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          clearInterval(check);
          var loader = document.getElementById('app-loading');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(function(){ loader.remove(); }, 700);
          }
        }
      }, 80);
    });
  </script>
</body>

</html>
